services:
  winutil-astro:
    container_name: winutil-astro
    build:
      context: .
      args:
        NODE_VERSION: 24
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - .:/app
      - astro_node_modules:/app/node_modules
    tmpfs:
      - /app/.astro:mode=1777
    environment:
      - CHOKIDAR_USEPOLLING=true
      - ASTRO_TELEMETRY_DISABLED=1
      - UV_THREADPOOL_SIZE=32

volumes:
  astro_node_modules:
