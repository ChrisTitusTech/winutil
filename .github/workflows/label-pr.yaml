name: Label PRs by Type of Change

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  label-pr:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'docs-update'
    runs-on: ubuntu-latest
    concurrency:
      group: label-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      issues: write
      contents: read  # Often needed for github-script
    steps:
      - name: Check PR Title for Type of Change
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const title = pr.title || '';
            const labelsByTag = {
              'feat': 'new feature',
              'fix': 'bug',
              'chore': 'chore',
              'docs': 'documentation',
              'ui-ux': 'ui update'
            };

            // Title format from the PR template: "tag(section): description" or "docs: description"
            const match = title.match(/^\s*(feat|fix|chore|docs|ui-ux)(?:\([^)]*\))?:/i);
            const typeLabel = match && labelsByTag[match[1].toLowerCase()];
            // Labels may have been assigned by a maintainer; never remove type labels.
            if (typeLabel && !pr.labels.some(label => label.name === typeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [typeLabel]
              });
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const isDocsPath = path => path.startsWith('docs/') || path === 'README.md';
            const docsOnly = files.length > 0 && files.every(file =>
              [file.filename, file.previous_filename].filter(Boolean).every(path =>
                isDocsPath(path)
              )
            );
            // Keep automatic classification separate from the manual skip-changelog override.
            const hasDocsOnly = pr.labels.some(
              label => label.name === 'docs-only'
            );

            if (!docsOnly && hasDocsOnly) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'docs-only'
              });
            } else if (docsOnly && !hasDocsOnly) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['docs-only']
              });
            }
