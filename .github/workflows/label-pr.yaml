name: Label PRs by Type of Change

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  label-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read  # Often needed for github-script
    steps:
      - name: Check PR Title for Type of Change
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const labelsByTag = {
              'feat': 'new feature',
              'fix': 'bug',
              'chore': 'chore',
              'docs': 'documentation',
              'ui-ux': 'ui update'
            };

            // Title format from the PR template: "tag(section): description" or "docs: description"
            const match = title.match(/^\s*(feat|fix|chore|docs|ui-ux)(?:\([^)]*\))?:/i);

            if (match) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [labelsByTag[match[1].toLowerCase()]]
              });
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const codePaths = ['functions/', 'scripts/', 'config/', 'xaml/'];
            const hasCodeChanges = files.some(file =>
              [file.filename, file.previous_filename].some(path =>
                path && (path === 'Compile.ps1' || codePaths.some(prefix => path.startsWith(prefix)))
              )
            );
            const hasSkipChangelog = context.payload.pull_request.labels.some(
              label => label.name === 'skip-changelog'
            );

            if (hasCodeChanges && hasSkipChangelog) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'skip-changelog'
              });
            } else if (!hasCodeChanges && !hasSkipChangelog) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['skip-changelog']
              });
            }
