name: Pre-Release WinUtil

permissions:
  contents: write
  actions: read
  pull-requests: write

on:
  workflow_dispatch: # Manual trigger added

jobs:
  build-runspace:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    env:
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Dev Docs and Update JSON Links
        shell: pwsh
        run: |
          Set-Location tools
          ./devdocs-generator.ps1

      - name: Compile project
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; ./Compile.ps1
        continue-on-error: false # Directly fail the job on error, removing the need for a separate check

      - name: Create Pull Request for Updated Docs and JSON Links
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MERGE }}
          commit-message: 'chore: Update generated dev docs and JSON links'
          title: 'chore: Update generated dev docs and JSON links'
          body: 'Automated update of generated documentation and JSON config links from pre-release build'
          branch: docs-update
          delete-branch: true
          add-paths: |
            docs/src/content/docs/code-reference/
            config/tweaks.json
            config/feature.json
          labels: |
            automated
            documentation
            skip-changelog

      - name: Check outputs
        shell: bash
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Set Version to Todays Date
        id: extract_version
        run: |
          $version = (Get-Date -Format "yy.MM.dd")
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Tag
        id: create_tag
        run: |
          $tagRef = "refs/tags/$env:VERSION"
          $tagLine = git ls-remote --tags origin $tagRef
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not query remote tags (git ls-remote exit $LASTEXITCODE)."
            exit 1
          }
          if (-not $tagLine) {
            # Reserve the date tag. A concurrent run targeting the same commit may win the
            # race and make this push a silent no-op ("Everything up-to-date"); the
            # same-commit check below then treats that as the identical build and resumes.
            git tag $env:VERSION
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create tag $env:VERSION"
              exit 1
            }
            git push origin $tagRef
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to reserve tag $env:VERSION (does it already exist remotely?)"
              exit 1
            }
          } else {
            # Recovery after a partial release: reuse the tag only when it points at this exact
            # commit, meaning the same build that reserved it. Never repoint an existing tag.
            $peeledLine = git ls-remote --tags origin "$tagRef^{}"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not resolve the existing tag (git ls-remote exit $LASTEXITCODE)."
              exit 1
            }
            $existingCommit = if ($peeledLine) { ($peeledLine -split '\s+')[0] } else { ($tagLine -split '\s+')[0] }
            $headCommit = git rev-parse HEAD
            if ($existingCommit -ne $headCommit) {
              Write-Error "Tag $env:VERSION already exists for commit $existingCommit, not $headCommit; refusing to reuse a date tag for a different build."
              exit 1
            }
            Write-Host "Tag $env:VERSION already exists for this commit; resuming the release."
          }
        shell: pwsh

      - name: Upload compiled script
        uses: actions/upload-artifact@v7
        with:
          name: winutil-ps1
          path: ./winutil.ps1

  release:
    needs: build-runspace
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled script
        uses: actions/download-artifact@v8
        with:
          name: winutil-ps1

      - name: Set version from build job
        run: echo "VERSION=${{ needs.build-runspace.outputs.version }}" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: generate_notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          version: ${{ env.VERSION }}

      - name: Remove Automated Updates from Release Notes
        id: filter_notes
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.generate_notes.outputs.body }}
        run: |
          $filteredNotes = ($env:RELEASE_NOTES -split '\r?\n' | Where-Object {
            $_ -notmatch '(?i)Update (Generated Dev Docs|Sponsors)'
          }) -join "`n"

          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $filteredNotes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Pre-Release ${{ env.VERSION }}
          body: |
            ${{ steps.filter_notes.outputs.body }}

            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/ChrisTitusTech/winutil/${{ env.VERSION }}/winutil.ps1)
          append_body: false
          files: ./winutil.ps1
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
